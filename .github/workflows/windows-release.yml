name: Desktop builds and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test (MSVC x64)
        shell: pwsh
        run: ./build_windows.ps1

      - name: Package Windows executable and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item build/Release/AudioViz_PC.exe dist/AudioViz-PC-Windows-x64.exe
          Copy-Item dist/AudioViz-PC-Windows-x64.exe dist/package/AudioViz_PC.exe
          Copy-Item README.md,LICENSE,THIRD_PARTY.md dist/package/
          Copy-Item licenses dist/package/licenses -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath dist/AudioViz-PC-Windows-x64.zip
          $exeHash = (Get-FileHash dist/AudioViz-PC-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash dist/AudioViz-PC-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  AudioViz-PC-Windows-x64.exe", "$zipHash  AudioViz-PC-Windows-x64.zip") |
            Set-Content dist/SHA256SUMS-Windows-x64.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioviz-pc-windows-x64
          path: |
            dist/AudioViz-PC-Windows-x64.exe
            dist/AudioViz-PC-Windows-x64.zip
            dist/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error
          retention-days: 14

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxrender-dev \
            libxss-dev libgl1-mesa-dev libdbus-1-dev libudev-dev

      - name: Build, test and smoke-test (Linux x64)
        run: ./build_unix.sh build-linux

      - name: Package Linux executable and licenses
        run: |
          set -euo pipefail
          mkdir -p dist/package/licenses
          install -m 0755 build-linux/AudioViz_PC dist/AudioViz-PC-Linux-x64
          install -m 0755 build-linux/AudioViz_PC dist/package/AudioViz_PC
          cp README.md LICENSE THIRD_PARTY.md dist/package/
          cp -R licenses/. dist/package/licenses/
          tar -C dist/package -czf dist/AudioViz-PC-Linux-x64.tar.gz .
          cd dist
          sha256sum AudioViz-PC-Linux-x64 AudioViz-PC-Linux-x64.tar.gz \
            > SHA256SUMS-Linux-x64.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioviz-pc-linux-x64
          path: |
            dist/AudioViz-PC-Linux-x64
            dist/AudioViz-PC-Linux-x64.tar.gz
            dist/SHA256SUMS-Linux-x64.txt
          if-no-files-found: error
          retention-days: 14

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: brew install ninja

      - name: Build, test and smoke-test (macOS ${{ matrix.arch }})
        run: ./build_unix.sh build-macos

      - name: Package macOS app and licenses
        run: |
          set -euo pipefail
          mkdir -p dist/package/licenses
          cp -R build-macos/AudioViz_PC.app dist/package/
          cp README.md LICENSE THIRD_PARTY.md dist/package/
          cp -R licenses/. dist/package/licenses/
          ditto -c -k --sequesterRsrc dist/package \
            "dist/AudioViz-PC-macOS-${{ matrix.arch }}.app.zip"
          cd dist
          shasum -a 256 "AudioViz-PC-macOS-${{ matrix.arch }}.app.zip" \
            > "SHA256SUMS-macOS-${{ matrix.arch }}.txt"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioviz-pc-macos-${{ matrix.arch }}
          path: |
            dist/AudioViz-PC-macOS-${{ matrix.arch }}.app.zip
            dist/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all tested packages
        uses: actions/download-artifact@v4
        with:
          pattern: audioviz-pc-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        run: cat dist/SHA256SUMS-*.txt | sort > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/AudioViz-PC-* dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AudioViz PC $RELEASE_TAG" \
            --notes "Windows x64: EXE or ZIP. Linux x64: executable or tar.gz. macOS: choose arm64 for Apple Silicon or x64 for Intel. macOS packages are currently unsigned." \
            --generate-notes
